name: Verify repository baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install exact validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-deps --requirement requirements-dev.txt
      - name: Verify generated schema proposals are exact
        run: |
          python3 tools/build_schemas.py
          git diff --exit-code -- schemas
      - name: Frozen-validate the exact first Pack
        run: python3 tools/validate_pack.py packs/learn/nin.global.learn.ai-literacy/v0.1.0-draft.1 --frozen
      - name: Run fail-closed repository verifier
        run: python3 scripts/verify_repository.py
      - name: Run regression contracts
        run: python3 -m unittest discover -s tests -v
